<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Base Plate Gradients -->
    <linearGradient id="basePlateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d3846"/>
      <stop offset="100%" stop-color="#241f31"/>
    </linearGradient>
    <linearGradient id="baseLipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1a29"/>
      <stop offset="100%" stop-color="#14111d"/>
    </linearGradient>

    <!-- Projectile (Yeet Tomato/Rocket) Gradients -->
    <radialGradient id="projectileGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff7800"/>
      <stop offset="40%" stop-color="#e01b24"/>
      <stop offset="100%" stop-color="#a51d2d"/>
    </radialGradient>

    <!-- Speed Trail Gradient -->
    <linearGradient id="trailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e66100" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ff7800" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#f6d32d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Target Reticle Gradients -->
    <linearGradient id="targetRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62a0ea"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="plateShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="impactGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#f6d32d" flood-opacity="0.75"/>
    </filter>
    <filter id="projectileShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-2" dy="4" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ================= BASE PLATE (GNOME SQUIRCLE) ================= -->
  <!-- Elevation Lip -->
  <rect x="12" y="14" width="104" height="104" rx="24" fill="url(#baseLipGrad)" filter="url(#plateShadow)"/>
  <!-- Front Surface -->
  <rect x="12" y="12" width="104" height="102" rx="24" fill="url(#basePlateGrad)"/>
  
  <!-- Subtle Highlight Line on Top Edge -->
  <path d="M 36 13 L 92 13" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2" stroke-linecap="round"/>

  <!-- Stream Canvas Grid Guidelines (Subtle) -->
  <g stroke="#9a9996" stroke-width="0.75" stroke-opacity="0.15" stroke-dasharray="3 3">
    <line x1="12" y1="46" x2="116" y2="46"/>
    <line x1="12" y1="80" x2="116" y2="80"/>
    <line x1="46" y1="12" x2="46" y2="114"/>
    <line x1="82" y1="12" x2="82" y2="114"/>
  </g>

  <!-- ================= TARGET RETICLE (AVATAR BOUNDARY) ================= -->
  <g transform="translate(76, 52)">
    <!-- Outer Reticle Ring (Capsule/Pill Target Motif) -->
    <rect x="-24" y="-30" width="48" height="60" rx="24" fill="none" stroke="url(#targetRingGrad)" stroke-width="3" stroke-dasharray="8 4" opacity="0.85"/>
    <!-- Inner Crosshair Center -->
    <circle cx="0" cy="0" r="14" fill="#3584e4" fill-opacity="0.1" stroke="#62a0ea" stroke-width="2"/>
    <circle cx="0" cy="0" r="4" fill="#62a0ea"/>
    <!-- Crosshair Ticks -->
    <line x1="-30" y1="0" x2="-18" y2="0" stroke="#62a0ea" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="0" x2="30" y2="0" stroke="#62a0ea" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-36" x2="0" y2="-24" stroke="#62a0ea" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="24" x2="0" y2="36" stroke="#62a0ea" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ================= SPEED & TRAJECTORY TRAILS ================= -->
  <!-- Ballistic Trajectory Curve -->
  <path d="M 20 102 C 34 94 48 76 74 54" fill="none" stroke="url(#trailGrad)" stroke-width="6" stroke-linecap="round"/>
  <!-- Secondary Speed Streaks -->
  <path d="M 28 108 C 42 100 54 84 66 70" fill="none" stroke="#ff7800" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M 18 90 C 30 82 44 68 62 50" fill="none" stroke="#f6d32d" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- ================= PROJECTILE (IN-FLIGHT IMPACTOR) ================= -->
  <g transform="translate(68, 58) rotate(-35)" filter="url(#projectileShadow)">
    <!-- Projectile Body (Dynamic Tomato / Core) -->
    <ellipse cx="0" cy="0" rx="14" ry="12" fill="url(#projectileGrad)"/>
    <!-- Top Highlight -->
    <ellipse cx="-4" cy="-4" rx="6" ry="3.5" fill="#ffffff" opacity="0.6" transform="rotate(-15)"/>
    <!-- Green Stem -->
    <path d="M -8 -8 C -14 -12 -12 -16 -16 -16 C -13 -14 -9 -10 -7 -9 Z" fill="#33d17a"/>
    <circle cx="-7" cy="-7" r="2.5" fill="#26a269"/>
  </g>

  <!-- ================= IMPACT BURST / PARTICLES ================= -->
  <g transform="translate(76, 52)" filter="url(#impactGlow)">
    <!-- Impact Sparks / Kinetic Stars -->
    <polygon points="0,-16 3,-7 12,-7 5,-1 8,8 0,3 -8,8 -5,-1 -12,-7 -3,-7" fill="#ffffff" transform="scale(0.8)"/>
    <circle cx="16" cy="-12" r="2.5" fill="#f6d32d"/>
    <circle cx="-14" cy="-18" r="2" fill="#ff7800"/>
    <circle cx="20" cy="10" r="1.8" fill="#ffffff"/>
    <circle cx="10" cy="22" r="2.2" fill="#f6d32d"/>
  </g>
</svg>
