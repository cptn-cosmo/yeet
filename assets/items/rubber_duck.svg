<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="duckYellow" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="60%" stop-color="#f6d32d"/>
      <stop offset="100%" stop-color="#e5a50a"/>
    </radialGradient>
    <linearGradient id="beakOrange" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#e66100"/>
    </linearGradient>
  </defs>
  <!-- Duck Body -->
  <path d="M 20 65 Q 15 45 40 45 Q 45 45 50 48 Q 65 30 75 35 Q 85 45 85 65 Q 85 85 50 85 Q 25 85 20 65 Z" fill="url(#duckYellow)"/>
  <!-- Tail -->
  <path d="M 20 60 Q 5 50 15 40 Q 22 48 25 55 Z" fill="url(#duckYellow)"/>
  <!-- Wing -->
  <ellipse cx="45" cy="65" rx="16" ry="10" fill="#e5a50a" opacity="0.6" transform="rotate(-10 45 65)"/>
  <!-- Head -->
  <circle cx="68" cy="40" r="18" fill="url(#duckYellow)"/>
  <!-- Beak -->
  <path d="M 80 40 Q 98 42 96 48 Q 88 52 78 48 Z" fill="url(#beakOrange)"/>
  <!-- Eye -->
  <circle cx="72" cy="35" r="3.5" fill="#241f31"/>
  <circle cx="73" cy="34" r="1.2" fill="#ffffff"/>
  <!-- Blush -->
  <ellipse cx="68" cy="45" rx="5" ry="3" fill="#ff7800" opacity="0.3"/>
</svg>
