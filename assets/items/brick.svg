<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 70" width="120" height="70">
  <defs>
    <linearGradient id="brickTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e66100"/>
      <stop offset="100%" stop-color="#c64600"/>
    </linearGradient>
    <linearGradient id="brickFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b53800"/>
      <stop offset="100%" stop-color="#802600"/>
    </linearGradient>
    <linearGradient id="brickSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#992f00"/>
      <stop offset="100%" stop-color="#661f00"/>
    </linearGradient>
  </defs>
  <!-- 3D Isometric Brick -->
  <!-- Top Face -->
  <polygon points="35,5 110,5 85,25 10,25" fill="url(#brickTop)"/>
  <!-- Front Face -->
  <polygon points="10,25 85,25 85,62 10,62" fill="url(#brickFront)"/>
  <!-- Side Face -->
  <polygon points="85,25 110,5 110,42 85,62" fill="url(#brickSide)"/>
  <!-- Holes on top face -->
  <ellipse cx="32" cy="15" rx="6" ry="3" fill="#541b02" opacity="0.85"/>
  <ellipse cx="60" cy="15" rx="6" ry="3" fill="#541b02" opacity="0.85"/>
  <ellipse cx="88" cy="15" rx="6" ry="3" fill="#541b02" opacity="0.85"/>
  <!-- Texture scratches/lines -->
  <line x1="20" y1="35" x2="45" y2="35" stroke="#d54b00" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="55" y1="48" x2="80" y2="48" stroke="#d54b00" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="30" y1="52" x2="48" y2="52" stroke="#601c00" stroke-width="1.5" stroke-linecap="round"/>
</svg>
